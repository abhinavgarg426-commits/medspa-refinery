[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-browser-sdk"
version = "1.0.0"
description = "Python SDK for Agent Browser Knowledge Graph API - The Google for AI Agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Agent Browser", email = "api@agent-browser.example.com"}
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
llamaindex = ["llama-index>=0.10.0"]

[project.urls]
Homepage = "https://medspa-refinery-api-44xz.onrender.com"
Documentation = "https://medspa-refinery-api-44xz.onrender.com/docs"
Repository = "https://github.com/abhinavgarg426-commits/medspa-refinery"
Manifest = "https://medspa-refinery-api-44xz.onrender.com/llms.json"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_browser_sdk*"]
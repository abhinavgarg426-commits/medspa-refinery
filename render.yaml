# Render Blueprint for Miami MedSpa Data Refinery
# Deploy to Render: https://render.com/docs/blueprint-spec

services:
  # Main FastAPI Web Service with x402 HTTP 402 micropayments
  - type: web
    name: medspa-refinery-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RECEIVING_WALLET
        sync: false
        # Set this in Render dashboard: your Base/USDC wallet address
        # Example: 0x742d35Cc6634C0532925a3b844Bc454e4438f44e
      - key: PRICE_PER_REQUEST_USD
        value: "0.002"
      - key: PYTHONUNBUFFERED
        value: "1"
    # Health check endpoint
    healthCheckPath: /health
    # Auto-deploy on git push
    autoDeploy: true
    # Free tier compatible (512MB RAM, 0.1 CPU)
    # Upgrade to Starter for custom domains, more resources
    plan: free

# Database: SQLite file is copied into Docker image at build time (no persistent disk needed)
# For production with persistent data, upgrade to Starter plan and add disk:
# disk:
#   name: medspa-data
#   mountPath: /app/data
#   sizeGB: 1

# If you need PostgreSQL later for scaling, uncomment below:
# databases:
#   - name: medspa-postgres
#     databaseName: medspa
#     user: medspa
#     plan: free